services:
  kungfuchess-3000:
    build: .
    volumes:
      - .:/kungfuchess
    container_name: kungfuchess-3000
    ports:
      - "3000:3000"
    environment:
      DB_USER: kungfuchess
      DB_PASSWORD: kungfuchesspass
      DB_HOST: mysql
      DB_NAME: kungfuchess
      WS_DOMAIN_MAIN: 127.0.0.1:3000
      WS_DOMAIN: 127.0.0.1:3000
    depends_on:
      mysql:
        condition: service_healthy

  kungfuchess-3001:
    build: .
    volumes:
      - .:/kungfuchess
    container_name: kungfuchess-3001
    ports:
      - "3001:3000"
    environment:
        DB_USER: kungfuchess
        DB_PASSWORD: kungfuchesspass
        DB_HOST: mysql
        DB_NAME: kungfuchess
        WS_DOMAIN_MAIN: 127.0.0.1:3000
        WS_DOMAIN: 127.0.0.1:3000
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: kungfuchess-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: kungfuchess
      MYSQL_USER: kungfuchess
      MYSQL_PASSWORD: kungfuchesspass
      WS_DOMAIN_MAIN: 127.0.0.1:3000
      WS_DOMAIN: 127.0.0.1:3000
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql_data:
